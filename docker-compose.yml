services:
  discord-bot-moderation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot-moderation
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      # Discord configuration
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}

